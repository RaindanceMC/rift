# Generated in shape by StandaloneDescriptor and checked by DescriptorTest — see rtp-standalone's own copy for
# why every line here matters, and for the two ways of writing this file that fail silently.
name: ${plugin.name}
version: '${plugin.version}'
main: de.raindancer.modules.wrapper.ModulePlugin
bootstrapper: de.raindancer.modules.wrapper.ModuleBootstrap
api-version: '26.3'
description: 'A pocket dimension for your things: a vault of pages that grows as you play, with search, sorting and selling.'
author: Raindancer118
website: https://github.com/RaindanceMC/rift

# Nothing in the module touches Bukkit.getScheduler(). Saves go through Core's Scheduling off the player's thread,
# and whatever a sale hands back is put in on the player's own region.
folia-supported: true

dependencies:
  # Both phases — see rtp-standalone's own copy of this file: without bootstrap the module fails to link at
  # bootstrap and the plugin reports that it contains no modules.
  bootstrap:
    RainsCore:
      load: BEFORE
      required: true
      join-classpath: true
  server:
    RainsCore:
      load: BEFORE
      required: true
      join-classpath: true
